services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: selena
      POSTGRES_USER: selena
      POSTGRES_PASSWORD: selena-development-only
    ports:
      - "5432:5432"
    volumes:
      - selena-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U selena -d selena"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  selena-postgres:
