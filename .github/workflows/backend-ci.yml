name: Backend CI

on:
  pull_request:
    branches: [main, phase-0-governance-threat-model]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main, phase-2-backend-foundation]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: selena_test
          POSTGRES_USER: selena
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U selena -d selena_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DJANGO_SETTINGS_MODULE: selena_api.settings.test
      DJANGO_SECRET_KEY: ci-only-not-production
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: selena_test
      POSTGRES_USER: selena
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and dev tools
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run

      - name: Django system checks
        run: python manage.py check

      - name: Migrate
        run: python manage.py migrate --noinput

      - name: Tests
        run: pytest

      - name: Python dependency audit
        run: pip-audit

      - name: Production deploy checks
        env:
          DJANGO_SETTINGS_MODULE: selena_api.settings.production
          DJANGO_SECRET_KEY: ci-production-check-secret-not-real
          DJANGO_ALLOWED_HOSTS: selena.example
          DJANGO_CSRF_TRUSTED_ORIGINS: https://selena.example
          DJANGO_SECURE_SSL_REDIRECT: "true"
          DJANGO_SECURE_HSTS_SECONDS: "3600"
        run: python manage.py check --deploy
